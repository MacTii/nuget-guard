<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" width="760" height="452" font-family="'Cascadia Code','SF Mono',Consolas,'Liberation Mono',Menlo,monospace">
  <style>
    .win{fill:#0d1117}
    .bar{fill:#161b22}
    text{font-size:15px;dominant-baseline:middle}
    .prompt{fill:#7ee787}
    .cmd{fill:#e6edf3}
    .dim{fill:#8b949e}
    .head{fill:#79c0ff;font-weight:700}
    .ok{fill:#3fb950}
    .red{fill:#f85149}
    .org{fill:#d29922}
    .blue{fill:#58a6ff}
    .prp{fill:#bc8cff}
    .num{fill:#e6edf3;font-weight:700}
    .row{opacity:0;animation:reveal .01s linear forwards}
    @keyframes reveal{to{opacity:1}}
    @keyframes blink{50%{opacity:0}}
    .cursor{fill:#7ee787;animation:blink 1.1s step-end infinite}
    .r1{animation-delay:.3s}.r2{animation-delay:.9s}.r3{animation-delay:1.4s}
    .r4{animation-delay:2.0s}.r5{animation-delay:2.3s}.r6{animation-delay:2.5s}
    .r7{animation-delay:2.7s}.r8{animation-delay:2.9s}.r9{animation-delay:3.1s}
    .r10{animation-delay:3.3s}.r11{animation-delay:3.8s}
    @media (prefers-reduced-motion:reduce){.row{opacity:1;animation:none}.cursor{animation:none}}
  </style>

  <rect class="win" width="760" height="452" rx="10"/>
  <rect class="bar" width="760" height="34" rx="10"/>
  <rect class="bar" y="20" width="760" height="14"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="17" r="6" fill="#27c93f"/>
  <text x="380" y="17" text-anchor="middle" class="dim" font-size="13">nuget-guard</text>

  <g transform="translate(24,64)">
    <text class="row r1"><tspan class="prompt">$</tspan> <tspan class="cmd">nuget-guard --export html</tspan></text>

    <text y="34" class="row r2"><tspan class="dim">🔍 Scanning solution:</tspan> <tspan class="cmd">Shop.sln</tspan> <tspan class="dim">(12 projects)</tspan></text>
    <text y="60" class="row r3"><tspan class="ok">✅ Metadata fetched for 84 packages</tspan></text>

    <text y="100" class="head row r4">━━━  SUMMARY  ━━━</text>

    <text y="130" class="row r5"><tspan class="dim">Vulnerable</tspan><tspan x="220" class="red">🚨 3</tspan></text>
    <text y="156" class="row r6"><tspan class="dim">Deprecated</tspan><tspan x="220" class="org">⚠️  5</tspan></text>
    <text y="182" class="row r7"><tspan class="dim">Outdated</tspan><tspan x="220" class="blue">📦 21</tspan></text>
    <text y="208" class="row r8"><tspan class="dim">Proprietary</tspan><tspan x="220" class="prp">🔒 2</tspan></text>
    <text y="234" class="row r9"><tspan class="dim">Redundant</tspan><tspan x="220" class="prp">🔗 8</tspan></text>
    <text y="260" class="row r10"><tspan class="dim">Licenses</tspan><tspan x="220" class="num">84</tspan> <tspan class="dim">(🔴 2  🟡 6  🟢 76)</tspan></text>

    <text y="300" class="row r11"><tspan class="ok">💾 HTML saved:</tspan> <tspan class="cmd">nuget-report.html</tspan> <tspan class="cursor">▋</tspan></text>
  </g>
</svg>
